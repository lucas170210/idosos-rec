<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Rec - Idosos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="header">
    <h1>Painel de Informações</h1>
  </header>

  <main class="dashboard-grid">
    <div class="card" data-title="Saúde e Exercícios" data-content="Praticar 30 minutos de caminhada leve diariamente melhora a circulação e fortalece as articulações.">
      <span class="card-tag">Saúde</span>
      <h2>Saúde e Exercícios</h2>
      <p>Clique para ver detalhes e dicas diárias.</p>
    </div>

    <div class="card" data-title="Lembrete de Medicamentos" data-content="Organize os remédios por horário do dia: manhã, tarde e noite. Sempre consulte a receita médica.">
      <span class="card-tag">Lembrete</span>
      <h2>Lembrete de Medicamentos</h2>
      <p>Veja como organizar sua rotina médica.</p>
    </div>

    <div class="card" data-title="Alimentação Saudável" data-content="Consuma frutas, vegetais e mantenha-se hidratado bebendo pelo menos 2 litros de água ao longo do dia.">
      <span class="card-tag">Nutrição</span>
      <h2>Alimentação Saudável</h2>
      <p>Orientações para uma boa nutrição na terceira idade.</p>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card">
      <button class="close-btn" id="close-modal">&times;</button>
      <h2 id="modal-title">Título do Modal</h2>
      <p id="modal-body">Conteúdo detalhado aqui...</p>
      
      <div class="modal-actions">
        <button id="read-btn" class="btn-read">
          🔊 Ouvir Conteúdo
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
